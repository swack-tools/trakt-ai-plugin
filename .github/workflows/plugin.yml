name: Plugin package
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Validate package boundaries and contracts
        run: |
          python3 scripts/check_plugin.py
      - name: Validate reviewed catalog metadata offline
        run: |
          python3 -m pip install -r requirements-catalog.txt
          python3 scripts/check_catalog.py
      - name: Validate portable schemas and Agent Skills
        run: |
          python3 -m pip install 'jsonschema==4.25.1' 'PyYAML==6.0.2' 'skills-ref @ git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          python3 scripts/check_portable_schema.py
          for skill in plugins/trakt-mcp/skills/*; do skills-ref validate "$skill"; done
      - name: Run Claude's official validator
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.288 plugin validate --strict plugins/trakt-mcp
          npx --yes @anthropic-ai/claude-code@2.1.288 plugin validate --strict .claude-plugin/marketplace.json
      - name: Build deterministic submission artifacts
        run: |
          python3 scripts/package_plugin.py
          python3 scripts/package_plugin.py --output "$RUNNER_TEMP/trakt-package-repeat"
          diff dist/submission/SHA256SUMS "$RUNNER_TEMP/trakt-package-repeat/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-submission-review
          path: dist/submission/
          if-no-files-found: error
