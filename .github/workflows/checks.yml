name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rust-and-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            target
          key: ${{ runner.os }}-rust-1.98.1-worker-build-0.1.14-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
      - name: Generate credential-free validation configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_KV_NAMESPACE: '00000000000000000000000000000000'
          CLOUDFLARE_PLUGIN_DNS: plugin.example.test
          CLOUDFLARE_ZONE_NAME: example.test
        run: python3 scripts/manage.py configure
      - name: Rust format, tests, and WASM Clippy
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching worker-build
        run: command -v worker-build || cargo install worker-build --version 0.1.14 --locked
      - run: npm run build
      - name: Exercise MCP with the official SDK and local workerd
        run: npm run test:integration
      - name: Validate Worker deployment package
        run: npx wrangler deploy --dry-run

  python-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Lint Python
        run: python3 -m ruff check scripts tests docs
      - name: Test configuration, package boundaries, and CI policy
        run: python3 -m unittest discover -s tests -p '*.py' -v
      - name: Validate complete official API catalog offline
        run: python3 scripts/update_trakt_catalog.py --offline-check
      - name: Check API and documentation route separation
        run: python3 scripts/check_routes.py
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint"'
