name: Release plugin archives

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Require tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require tag to match plugin version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("plugins/trakt-mcp/plugin.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Validate reviewed catalog metadata offline
        run: |
          python3 -m pip install -r requirements-catalog.txt
          python3 scripts/check_catalog.py
      - name: Build Claude and Codex archives
        run: python3 scripts/package_release.py "$RUNNER_TEMP/release"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/trakt-mcp-claude.zip" \
            "$RUNNER_TEMP/release/trakt-mcp-codex.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --verify-tag --generate-notes

  notify-marketplace:
    name: Request marketplace refresh
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch marketplace build
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure MARKETPLACE_DISPATCH_TOKEN with Actions write access to swack-tools/ai-plugin-marketplace."
            exit 1
          fi
          gh workflow run pages.yml \
            --repo swack-tools/ai-plugin-marketplace \
            --ref main \
            -f plugin_repository="$GITHUB_REPOSITORY" \
            -f plugin_tag="$GITHUB_REF_NAME"
          echo "Requested marketplace refresh for $GITHUB_REPOSITORY at $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
