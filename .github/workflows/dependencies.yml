name: Dependency advisories
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned public advisory scanners
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-reports"
          python3 -m pip install -r requirements-ci.txt
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Audit locked Rust and npm dependencies against OSV
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile Cargo.lock --lockfile package-lock.json --all-packages --format json --output-file "$RUNNER_TEMP/dependency-reports/osv.json"'
      - name: Audit npm registry advisories
        if: ${{ !cancelled() }}
        run: npm audit --json > "$RUNNER_TEMP/dependency-reports/npm.json"
      - name: Audit resolved Python dependencies against PyPI advisories
        if: ${{ !cancelled() }}
        run: python3 -m pip_audit -r requirements-ci.txt --format json --output "$RUNNER_TEMP/dependency-reports/python.json"
      - name: Save dependency scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-advisory-reports
          path: ${{ runner.temp }}/dependency-reports/
          if-no-files-found: error
          retention-days: 30
