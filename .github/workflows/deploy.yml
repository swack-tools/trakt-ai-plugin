name: Deploy WASM Worker to Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trakt-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            target
          key: ${{ runner.os }}-cargo-worker-build-0.1.14-${{ hashFiles('Cargo.toml') }}
      - run: npm ci
      - name: Generate ignored validation configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_KV_NAMESPACE: '00000000000000000000000000000000'
          CLOUDFLARE_PLUGIN_DNS: trakt.swacktech.com
          CLOUDFLARE_KV_NAMESPACE_NAME: TRAKT_SESSIONS
        run: python3 scripts/manage.py configure
      - name: Install matching worker-build
        run: command -v worker-build || cargo install worker-build --version 0.1.14 --locked
      - name: Check and test Rust
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: npm run build
      - run: npm run test:integration
      - name: Validate deployment package
        run: npx wrangler deploy --dry-run
      - name: Deploy code and encrypted secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: ${{ secrets.CLOUDFLARE_KV_NAMESPACE }}
          CLOUDFLARE_PLUGIN_DNS: trakt.swacktech.com
          CLOUDFLARE_KV_NAMESPACE_NAME: TRAKT_SESSIONS
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          python3 scripts/manage.py configure
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json') as f:
              json.dump({k: os.environ[k] for k in ('TRAKT_CLIENT_ID', 'TRAKT_CLIENT_SECRET')}, f)
              f.flush()
              subprocess.run(['npx', 'wrangler', 'deploy', '--secrets-file', f.name], check=True)
          PY
      - name: Check deployed health and authentication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/smoke.py
