name: Deploy WASM Worker to Cloudflare
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: trakt-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            target
          key: ${{ runner.os }}-rust-1.98.1-worker-build-0.1.14-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
      - name: Install matching worker-build
        run: command -v worker-build || cargo install worker-build --version 0.1.14 --locked
      - run: npm run build
      - name: Deploy code and encrypted secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: ${{ secrets.CLOUDFLARE_KV_NAMESPACE }}
          CLOUDFLARE_PLUGIN_DNS: ${{ vars.CLOUDFLARE_PLUGIN_DNS }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          OPENAI_APPS_CHALLENGE: ${{ secrets.OPENAI_APPS_CHALLENGE }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          python3 scripts/manage.py configure
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json') as f:
              json.dump({k: os.environ[k] for k in ('TRAKT_CLIENT_ID', 'TRAKT_CLIENT_SECRET', 'OPENAI_APPS_CHALLENGE', 'SUPPORT_EMAIL') if os.environ.get(k)}, f)
              f.flush()
              subprocess.run(['npx', 'wrangler', 'deploy', '--secrets-file', f.name], check=True)
          PY
      - name: Check deployed health and authentication
        env:
          CLOUDFLARE_PLUGIN_DNS: ${{ vars.CLOUDFLARE_PLUGIN_DNS }}
        run: python3 scripts/smoke.py
